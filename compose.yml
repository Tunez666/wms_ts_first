services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: wms-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - ./backend:/app:Z
      - backend_node_modules:/app/node_modules

    command: npm run start:dev

  postgres:
    image: postgres:18
    container_name: wms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: wms-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_node_modules: